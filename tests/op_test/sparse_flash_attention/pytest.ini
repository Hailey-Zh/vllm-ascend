[pytest]
markers =
    ci: mark a test as a CI test
    graph: marks tests as graph mode compilation tests
    npu_only: mark a test as NPU-only execution without CPU golden comparison
    step3c_dense: dense-mode (sparse_indices=None) correctness test; compares against sparse path with all-blocks-selected indices
    step4_packed_kv: packed_kv output correctness test; compares packed_key/packed_key_rope against PyTorch gather
